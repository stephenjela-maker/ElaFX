name: Build Windows VST3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target ELAFX_VST3

      - name: Upload Windows VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELA-FX-Windows-VST3
          path: build/ELAFX_artefacts/Release/VST3/
