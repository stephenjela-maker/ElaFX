name: Build VST3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target ELAFX_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: ELA-FX-VST3
          path: build/ELAFX_artefacts/Release/VST3/
